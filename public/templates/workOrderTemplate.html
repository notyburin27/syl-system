<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Sarabun", sans-serif;
        margin: 0;
        padding: 0;
        line-height: 1.3;
        font-size: 13px;
        color: #000;
        background: white;
      }

      /* Each A4 page wrapper */
      .a4-page {
        width: 210mm;
        height: 297mm;
        padding: 10mm 12mm;
        overflow: hidden;
        page-break-after: always;
        break-after: page;
        display: flex;
        flex-direction: column;
      }

      /* Half-page section */
      .section {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Dashed divider between two sections */
      .section-divider {
        border: none;
        border-top: 2px dashed #555;
        margin: 4mm 0;
        flex-shrink: 0;
      }

      .company-header {
        text-align: center;
        margin-bottom: 6px;
      }

      .company-name {
        font-size: 15px;
        font-weight: 700;
        margin-bottom: 1px;
      }

      .company-line {
        font-size: 11px;
        line-height: 1.4;
      }

      .header-rule {
        border: none;
        border-bottom: 1.5px solid #000;
        margin: 5px 0 8px 0;
      }

      .form-row {
        display: flex;
        align-items: flex-end;
        margin-bottom: 6px;
        border-bottom: 1px dotted #888;
        padding-bottom: 2px;
        min-height: 20px;
      }

      .form-row.align-top {
        align-items: flex-start;
      }

      .field-label {
        font-weight: 600;
        color: #1463d8;
        font-size: 12px;
        flex-shrink: 0;
        padding-right: 4px;
        width: 120px;
      }

      .field-label-right {
        font-weight: 600;
        color: #1463d8;
        font-size: 12px;
        flex-shrink: 0;
        padding-right: 4px;
        width: 80px;
      }

      .field-sep {
        margin: 0 4px;
        font-weight: 600;
        color: #1463d8;
        flex-shrink: 0;
      }

      .field-value {
        flex: 1;
        font-size: 13px;
        font-weight: 400;
        min-height: 16px;
        color: #000;
      }

      .row-split {
        display: flex;
        gap: 10px;
        margin-bottom: 6px;
      }

      .row-split > .form-row {
        flex: 1;
        margin-bottom: 0;
      }
    </style>
  </head>
  <body>
    {{PAGES}}
  </body>
</html>
