name: syl-transport-system
services:
  - name: web
    source_dir: /
    github:
      repo: notyburin27/syl-system
      branch: main
    build_command: npm install && npm run build
    run_command: npm start
    environment_slug: node-js
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    health_check:
      http_path: /health
    envs:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8080"
jobs:
  - name: sync-fuel-price
    kind: SCHEDULED
    build_command: npm install && npx prisma generate
    run_command: npx tsx scripts/sync-fuel-price.ts
    schedule:
      cron: "0 23 * * *" # 06:00 น. ไทย (UTC)
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
  - name: check-line-images
    kind: SCHEDULED
    build_command: npm install && npx prisma generate
    run_command: npx tsx scripts/check-line-images.ts
    schedule:
      cron: "0 * * * *" # ทุกชั่วโมง (UTC)
    instance_count: 1
    instance_size_slug: apps-s-1vcpu-0.5gb
